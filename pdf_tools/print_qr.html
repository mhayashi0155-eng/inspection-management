<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アプリQRコード (名刺サイズ)</title>
    <style>
        body {
            font-family: 'Segoe UI', Meiryo, sans-serif;
            background: #e0e5ec;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .controls {
            margin-bottom: 30px;
            text-align: center;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        
        .controls h2 {
            margin-top: 0;
            color: #1a73e8;
        }
        
        .controls button {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            background: #1a73e8;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(26,115,232,0.3);
            transition: background 0.2s;
        }
        
        .controls button:hover {
            background: #1557b0;
        }
        
        /* 名刺サイズのカードデザイン (日本標準サイズ 91mm x 55mm) */
        .business-card {
            width: 91mm;
            height: 55mm;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border: 1px dashed #999; /* 画面上でも切り取り線を見せる */
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6mm 4mm;
            box-sizing: border-box;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
        }
        
        .card-left {
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 58%;
            z-index: 2;
        }
        
        .card-left h1 {
            font-size: 16px;
            margin: 0 0 4px 0;
            color: #222;
            line-height: 1.2;
            border-bottom: 2px solid #1a73e8;
            padding-bottom: 2px;
            display: inline-block;
        }
        
        .card-left p {
            font-size: 8px;
            color: #555;
            margin: 4px 0 0 0;
            word-break: break-all;
            line-height: 1.4;
        }
        
        .card-left p.url {
            color: #1a73e8;
            font-weight: bold;
            margin-top: 5px;
            font-size: 7px;
        }
        
        .card-right {
            width: 38%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            z-index: 2;
        }
        
        .card-right img {
            width: 100%;
            height: auto;
            border: 1px solid #eee;
            padding: 2px;
            border-radius: 4px;
        }
        
        /* 少しおしゃれな角のアクセント */
        .business-card::before {
            content: "";
            position: absolute;
            top: -20px;
            left: -20px;
            width: 40px;
            height: 40px;
            background: #e3f2fd;
            border-radius: 50%;
            z-index: 1;
        }

        /* 印刷専用の設定 */
        @media print {
            body { 
                background: white; 
                padding: 0; 
                margin: 0; 
                justify-content: flex-start;
                align-items: flex-start;
            }
            .controls { 
                display: none; /* ボタンなどは印刷しない */
            }
            .business-card { 
                box-shadow: none; 
                border: 1px dashed #999; /* 切取り線として利用 */
                margin: 5mm; 
                page-break-inside: avoid;
            }
            @page {
                margin: 5mm; /* 用紙の余白を最小に */
            }
        }
    </style>
</head>
<body>

    <div class="controls">
        <h2>📱 タブレット用 QRコード</h2>
        <p style="font-size:14px; color:#555; margin-bottom: 20px;">下のカードは実際の名刺サイズ（91mm×55mm）に調整されています。<br>「印刷する」ボタンを押し、<strong>倍率を『既定（または100%）』</strong>に設定して印刷してください。</p>
        <button onclick="window.print()">🖨️ この名刺サイズを印刷する</button>
    </div>

    <!-- ここから下が名刺サイズ枠 -->
    <div class="business-card">
        <div class="card-left">
            <h1>Antigravity<br>点検表アプリ</h1>
            <p>お手持ちのタブレットやスマートフォンのカメラで右のQRコードを読み取ってアクセスしてください。</p>
            <p class="url">https://yama522133.static.jp/pdf_tools/pdf_app.html</p>
        </div>
        <div class="card-right">
            <!-- 完全に無料のQR生成APIを利用して、自動的にURLをQRコード化 -->
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https%3A%2F%2Fyama522133.static.jp%2Fpdf_tools%2Fpdf_app.html" alt="点検アプリ QRコード">
        </div>
    </div>

</body>
</html>
