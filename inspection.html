<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>車両系建設機械 定期自主検査表</title>
    <link rel="stylesheet" href="style.css?v=FixLayout_Final">
    <link rel="stylesheet" href="style.css?v=FixLayout_Final">
    <!-- Inline Print Styles to bypass cache and force layout -->
    <style media="print">
        @page {
            margin: 0;
            size: A4 landscape;
        }

        body {
            margin: 0;
            padding: 0;
            background: white;
            -webkit-print-color-adjust: exact;
        }

        /* DAILY INSPECTION MODE (1 Page Limit) */
        body.print-mode-daily,
        body.print-mode-daily html {
            height: 100%;
            overflow: hidden !important;
            /* Prevent 2nd page */
        }

        body.print-mode-daily .app-container {
            width: 1280px !important;
            min-width: 1280px !important;
            max-width: 1280px !important;
            margin: 0 !important;
            padding: 0 !important;
            zoom: normal !important;
            /* Revert to Scale for consistency and quality */
            transform: scale(0.85) !important;
            transform-origin: top left !important;
            display: block !important;
        }

        /* MONTHLY INSPECTION MODE (Standard Flow) */
        body:not(.print-mode-daily) .app-container {
            width: 1280px !important;
            /* Fixed width for consistency */
            transform: scale(0.54) !important;
            transform-origin: top left !important;
            /* Use transform as zoom is not supported/effective */
            margin: 0 !important;
            /* Adjust margin if needed, usually 0 with transform-origin left is safest to start */
        }

        /* Adjust grid for print to fill width */
        .inspection-grid {
            display: grid !important;
            grid-template-columns: 1fr 1fr 1fr !important;
            gap: 0.5rem !important;
            width: 100% !important;
        }

        /* HIDE non-print elements */
        .main-nav,
        .filter-bar,
        .action-buttons,
        .ghost-btn,
        .sidebar-decoration,
        .legend {
            display: none !important;
        }

        /* Ensure specific elements are visible and styled */
        .machine-info-grid {
            display: grid !important;
            grid-template-columns: repeat(6, 1fr) !important;
            gap: 0.5rem !important;
        }

        .main-footer {
            display: flex !important;
            gap: 1rem !important;
            margin-top: 1rem !important;
        }

        /* LABEL MODE OVERRIDES */
        body.print-mode-label .app-container {
            display: none !important;
        }

        body.print-mode-label {
            zoom: 0.75 !important;
        }

        body.print-mode-label .print-label-container {
            display: block !important;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            border: 4px solid #000;
            padding: 5mm;
            box-sizing: border-box;
            z-index: 100000;
        }
    </style>
    <!-- Google Fonts for a premium look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
        rel="stylesheet">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body>

    <!-- 機種選択モーダル -->
    <div id="machine-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2>点検する機械を選択</h2>

            <div class="modal-section">
                <h3>月次点検（車両系）</h3>
                <div class="machine-grid">
                    <button class="machine-btn" onclick="selectMachine('shovel')">
                        <span class="icon"><img src="assets/icons/backhoe.png" alt="バックホウ"></span>
                        <span class="text">ショベル系<br><small>(バックホウ)</small></span>
                    </button>
                    <button class="machine-btn" onclick="selectMachine('tractor')">
                        <span class="icon"><img src="assets/icons/bulldozer.png" alt="ブルドーザ・トラクタ"></span>
                        <span class="text">トラクタ系<br><small>(ブルドーザ、トラクタ等)</small></span>
                    </button>
                    <button class="machine-btn" onclick="selectMachine('crane')">
                        <span class="icon"><img src="assets/icons/crane.png" alt="クレーン"></span>
                        <span class="text">移動式クレーン</span>
                    </button>
                </div>
            </div>

            <div class="modal-section">
                <h3>日常始業点検 <span
                        style="font-size:0.8rem; font-weight:normal; color:#e11d48; margin-left:0.5rem;">※ショベル系は月次点検を作成すると自動で作成されます</span>
                </h3>
                <div class="machine-grid compact">
                    <button class="machine-btn" onclick="selectMachine('sandbag')">大型土のう</button>
                    <button class="machine-btn" onclick="selectMachine('power_tool')">電動工具</button>
                    <button class="machine-btn" onclick="selectMachine('generator')">発電機</button>
                    <button class="machine-btn" onclick="selectMachine('dist_board')">分電盤</button>
                    <button class="machine-btn" onclick="selectMachine('pump')">水中ポンプ</button>
                    <button class="machine-btn" onclick="selectMachine('arc_welder')">アーク溶接機</button>
                    <button class="machine-btn" onclick="selectMachine('elec_equip')">電気設備・機器</button>
                    <button class="machine-btn" onclick="selectMachine('hanging_tools')">玉掛け用具</button>
                    <button class="machine-btn" onclick="selectMachine('iron_plate')">敷鉄板</button>
                    <button class="machine-btn" onclick="selectMachine('security_daily')">保安点検</button>
                    <button class="machine-btn" onclick="selectMachine('excavation_daily')">地山掘削・土止め</button>
                    <button class="machine-btn" onclick="selectMachine('crane_daily')">移動式クレーン(始業)</button>
                </div>
            </div>
        </div>
    </div>

    <!-- メインアプリ画面 -->
    <div class="app-container" id="app-container" style="display: none;">
        <div class="company-title">株式会社山内組　点検表</div>

        <header class="main-header">
            <div class="header-top">
                <div class="header-controls">
                    <button onclick="goDashBoard()" class="secondary-btn">&lt; 一覧へ戻る</button>
                    <button id="change-machine-btn" class="secondary-btn">機種変更</button>
                </div>

                <h1 id="form-title">車両系建設機械 定期自主検査表(月例)</h1>

                <div id="print-month-display"></div>

                <div id="header-site-name"></div>
            </div>

            <div class="machine-info-grid">
                <div class="input-group" id="month-selector-group" style="display: none;">
                    <label>点検年月</label>
                    <input type="month" id="inspection-month">
                </div>
                <div class="input-group" id="site-name-group">
                    <label>機械名</label>
                    <input type="text" id="machine-name" placeholder="例：コベルコバックホー" list="machine-name-list">
                    <datalist id="machine-name-list">
                        <!-- JSで生成 -->
                    </datalist>
                </div>
                <div class="input-group" id="model-type-group">
                    <label>型式 <span class="required-mark">*</span></label>
                    <input type="text" id="model-type" placeholder="PC200-11">
                </div>
                <div class="input-group" id="company-machine-id-group">
                    <label>会社管理No. <span class="required-mark">*</span></label>
                    <input type="text" id="company-machine-id" placeholder="社内管理番号" list="machine-master-list">
                    <datalist id="machine-master-list">
                        <option value="データ読み込み中..."></option>
                    </datalist>
                    <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.25rem;">
                        ※会社管理No.を選択すると機械名・型式が自動表示されます</p>
                </div>
                <div class="input-group" id="machine-id-group">
                    <label>現場管理No. <span class="required-mark">*</span></label>
                    <input type="text" id="machine-id" placeholder="123456">
                </div>
                <div class="input-group" id="operating-hours-group">
                    <label>運転時間 (Hr) <span class="required-mark">*</span></label>
                    <input type="number" id="operating-hours" placeholder="1234.5">
                </div>
                <div class="input-group" id="inspection-date-group">
                    <label>検査年月日</label>
                    <input type="date" id="inspection-date">
                </div>
                <div class="input-group">
                    <label>現場代理人</label>
                    <input type="text" id="representative" placeholder="氏名" list="staff-list">
                </div>
                <div class="input-group">
                    <label>安全管理者</label>
                    <input type="text" id="safety-manager" placeholder="氏名" list="staff-list">
                </div>
                <div class="input-group">
                    <label>点検者(正)</label>
                    <input type="text" id="inspector-main" placeholder="氏名" list="staff-list">
                </div>
                <div class="input-group">
                    <label>点検者(副)</label>
                    <input type="text" id="inspector-sub" placeholder="氏名" list="staff-list">
                </div>
            </div>

            <datalist id="staff-list">
                <!-- JSで動的に追加されます -->
            </datalist>

            <div class="legend" id="legend-section">
                <span class="legend-item"><span class="mark good">レ</span> 良好</span>
                <span class="legend-item"><span class="mark adjust">A</span> 調整</span>
                <span class="legend-item"><span class="mark repair">△</span> 修理</span>
                <span class="legend-item"><span class="mark replace">X</span> 取替</span>
                <span class="legend-item"><span class="mark oil">L</span> 給油水</span>
                <span class="legend-item"><span class="mark clean">C</span> 清掃</span>
            </div>

            <div class="legend" id="daily-legend-section" style="display: none;">
                <span class="legend-item"><span class="mark good" style="color: #15803d;">○</span> 良好</span>
                <span class="legend-item"><span class="mark repair" style="color: #b91c1c;">×</span> 不良</span>
                <span class="legend-item"><span class="mark done" style="color: #0369a1;">●</span> 処置済</span>
            </div>
        </header>

        <!-- 月間シート形式のコンテナ（日常点検用） -->
        <div id="monthly-grid-view" class="monthly-grid-container" style="display: none;">
            <div class="grid-scroll-wrapper">
                <table id="monthly-table">
                    <thead>
                        <tr id="monthly-table-head">
                            <!-- JSで生成 -->
                        </tr>
                    </thead>
                    <tbody id="monthly-table-body">
                        <!-- JSで生成 -->
                    </tbody>
                </table>
            </div>
        </div>

        <main id="inspection-form" class="inspection-grid">
            <!-- 3カラムの点検項目がここにJSで生成されます -->
            <div class="column" id="col-1">
                <!-- エンジン・本体など -->
            </div>
            <div class="column" id="col-2">
                <!-- 走行・作業装置など -->
            </div>
            <div class="column" id="col-3">
                <!-- 電気・安全装置・その他 -->
            </div>
        </main>

        <footer class="main-footer">
            <div class="footer-input">
                <label>備考</label>
                <textarea id="remarks" rows="3"></textarea>
            </div>
            <div class="footer-input">
                <label>補修措置</label>
                <textarea id="repairs" rows="3"></textarea>
            </div>

            <div class="action-buttons">
                <button id="reset-btn" class="danger-btn">リセット</button>
                <button id="save-btn" class="primary-btn">保存</button>
                <button id="print-btn" class="success-btn">PDF発行 / 印刷</button>
            </div>
        </footer>

    </div>

    <script src="script.js?v=WYSIWYG_V1"></script>
</body>

</html>
